name: Monthly Employer Briefings

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-briefings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Ensure content directories
        run: mkdir -p src/content/briefings

      - name: Generate monthly briefings
        env:
          OPENAI_API_KEY: ${{ secrets.ChatGPT }}
          OPENAI_DAILY_TOKEN_CAP: ${{ vars.OPENAI_DAILY_TOKEN_CAP || '5000000' }}
          OPENAI_DAILY_USD_CAP: ${{ vars.OPENAI_DAILY_USD_CAP || '5' }}
        run: node scripts/generate-monthly-briefings.js

      - name: Fact-check briefings (multi-pass with web search)
        env:
          OPENAI_API_KEY: ${{ secrets.ChatGPT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_DAILY_TOKEN_CAP: ${{ vars.OPENAI_DAILY_TOKEN_CAP || '5000000' }}
          OPENAI_DAILY_USD_CAP: ${{ vars.OPENAI_DAILY_USD_CAP || '5' }}
        run: node scripts/fact-check.js src/content/briefings

      - name: Determine verification status
        id: verify-status
        run: |
          if [ -f src/content/verification.json ]; then
            STATUS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/content/verification.json','utf8')).status)")
            echo "status=$STATUS" >> $GITHUB_OUTPUT
          else
            echo "status=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        run: |
          git config user.name "AEA Content Bot"
          git config user.email "content-bot@americanemployers.org"
          git add src/content/ scripts/.api-usage.json 2>/dev/null || git add src/content/
          if git diff --staged --quiet; then
            echo "No new briefings to commit"
          else
            if [ "${{ steps.verify-status.outputs.status }}" = "verified" ]; then
              git commit -m "Monthly employer briefings: $(date +%B\ %Y) [all verified]"
            else
              git commit -m "Monthly employer briefings: $(date +%B\ %Y) [partial verification]"
            fi
            git push origin main
          fi
