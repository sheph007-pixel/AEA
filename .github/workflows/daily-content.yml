name: Daily Content Generation

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-content.yml'

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Ensure content directories
        run: |
          mkdir -p src/content/news
          mkdir -p src/content/resources

      - name: Generate daily news articles
        env:
          OPENAI_API_KEY: ${{ secrets.ChatGPT }}
        run: node scripts/generate-news.js

      - name: Fact-check news (multi-pass with web search)
        env:
          OPENAI_API_KEY: ${{ secrets.ChatGPT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/fact-check.js src/content/news

      - name: Determine verification status
        id: verify-status
        run: |
          if [ -f src/content/verification.json ]; then
            STATUS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/content/verification.json','utf8')).status)")
            echo "status=$STATUS" >> $GITHUB_OUTPUT
          else
            echo "status=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        run: |
          git config user.name "AEA Content Bot"
          git config user.email "content-bot@americanemployers.org"
          git add src/content/
          if git diff --staged --quiet; then
            echo "No new content to commit"
          else
            if [ "${{ steps.verify-status.outputs.status }}" = "verified" ]; then
              git commit -m "Daily content update: $(date +%Y-%m-%d) [all verified]"
            else
              git commit -m "Daily content update: $(date +%Y-%m-%d) [partial verification]"
            fi
            git push origin main
          fi
