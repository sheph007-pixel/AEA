name: Weekly Content Audit

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fact-check.js'
      - 'src/content/.fact-check-report.json'

permissions:
  contents: write

jobs:
  audit-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Full content audit (multi-pass with web search)
        env:
          OPENAI_API_KEY: ${{ secrets.ChatGPT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_FACTCHECK_MODEL: ${{ vars.OPENAI_FACTCHECK_MODEL || vars.OPENAI_MODEL || 'gpt-4o' }}
          # Weekly audit needs a higher cap because it scans every article.
          # ~250 articles * ~5k tokens each = ~1.25M expected; cap at 4M for headroom.
          # USD cap raised to $25 for the weekly job because gpt-4o is ~10x the
          # cost of gpt-4o-mini; weekly audit at gpt-4o lands ~$15-$20.
          OPENAI_DAILY_TOKEN_CAP: ${{ vars.OPENAI_WEEKLY_TOKEN_CAP || '4000000' }}
          OPENAI_DAILY_USD_CAP: ${{ vars.OPENAI_WEEKLY_USD_CAP || '25' }}
        run: node scripts/fact-check.js

      - name: Determine verification status
        id: verify-status
        run: |
          if [ -f src/content/verification.json ]; then
            STATUS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/content/verification.json','utf8')).status)")
            echo "status=$STATUS" >> $GITHUB_OUTPUT
          else
            echo "status=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Commit verification status
        run: |
          git config user.name "AEA Content Bot"
          git config user.email "content-bot@americanemployers.org"
          git add src/content/ scripts/.api-usage.json 2>/dev/null || git add src/content/
          if git diff --staged --quiet; then
            echo "No changes to verification status"
          else
            if [ "${{ steps.verify-status.outputs.status }}" = "verified" ]; then
              git commit -m "Weekly content audit: $(date +%Y-%m-%d) [all verified]"
            else
              git commit -m "Weekly content audit: $(date +%Y-%m-%d) [issues found]"
            fi
            git push origin main
          fi
